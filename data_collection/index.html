<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .chart-container { width: 80%; max-width: 800px; margin: auto; }
    </style>
</head>
<body>
    <h2>Sensor Data Dashboard</h2>
    <h3>Status: <span id="status-text" style="color: rgb(9, 221, 9);">Loading...</span></h3>
    
    <div class="chart-container">
        <canvas id="vibrationChart"></canvas>
    </div>

    <script>
    // 1. Initialize the Chart with 3 distinct lines
    const ctx = document.getElementById('vibrationChart').getContext('2d');
    const vibrationChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], 
            datasets: [
                { 
                    label: 'X-Axis (g)', 
                    borderColor: 'red', 
                    data: [], 
                    tension: 0.2, 
                    pointRadius: 0 // Hiding dots makes high-speed lines look much cleaner
                },
                { 
                    label: 'Y-Axis (g)', 
                    borderColor: 'green', 
                    data: [], 
                    tension: 0.2, 
                    pointRadius: 0 
                },
                { 
                    label: 'Z-Axis (g)', 
                    borderColor: 'blue', 
                    data: [], 
                    tension: 0.2, 
                    pointRadius: 0 
                }
            ]
        },
        options: {
            animation: false, // Turn off animations so live data doesn't lag
            scales: {
                y: { 
                    // Setting a standard scale so the graph doesn't violently bounce around
                    suggestedMin: -2, 
                    suggestedMax: 2 
                }
            }
        }
    });

    // 2. Function to fetch data and update the chart
    async function fetchSensorData() {
        try {
            // Call your Flask API
            const response = await fetch('/api/data'); 
            const data = await response.json();

            // Update the status text
            document.getElementById('status-text').innerText = data.status;

            // Get current time
            const now = new Date();
            const timeString = now.toLocaleTimeString();

            // Add the new time stamp to the X-axis
            vibrationChart.data.labels.push(timeString);

            // Push the 3 new data points to their respective lines
            vibrationChart.data.datasets[0].data.push(data.x_axis);
            vibrationChart.data.datasets[1].data.push(data.y_axis);
            vibrationChart.data.datasets[2].data.push(data.z_axis);

            // Keep only the last 50 data points (Expanded from 20 for a wider view)
            if (vibrationChart.data.labels.length > 50) {
                vibrationChart.data.labels.shift();
                vibrationChart.data.datasets[0].data.shift();
                vibrationChart.data.datasets[1].data.shift();
                vibrationChart.data.datasets[2].data.shift();
            }

            // Render the updated chart
            vibrationChart.update();
            
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    // 3. Poll the server much faster for motor vibrations! (Every 100ms instead of 1000ms)
    setInterval(fetchSensorData, 100);
    </script>
</body>
</html>
